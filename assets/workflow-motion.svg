<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
<title id="title">Aman Jain — Build, Analyse, Improve</title>
<desc id="desc">An animated motion graphic connecting software engineering, data analysis and business consulting, with featured project nodes.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080B12"/><stop offset="1" stop-color="#10252B"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67E8F9"/><stop offset=".52" stop-color="#2DD4BF"/><stop offset="1" stop-color="#BEF264"/></linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#94A3B8" stroke-opacity=".08"/></pattern>
</defs>
<rect width="1200" height="190" rx="20" fill="url(#bg)"/><rect width="1200" height="190" rx="20" fill="url(#grid)"/>
<text x="40" y="34" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="3">HOW I CREATE VALUE</text>
<path d="M75 91H1125" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
<path d="M75 91H1125" stroke="url(#line)" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 16" opacity=".95"><animate attributeName="stroke-dashoffset" from="0" to="-96" dur="5s" repeatCount="indefinite"/></path>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <g transform="translate(75 91)"><circle r="24" fill="#0B1720" stroke="#67E8F9" stroke-width="1.5"/><circle r="31" fill="none" stroke="#67E8F9" stroke-opacity=".28"><animate attributeName="r" values="28;36;28" dur="3s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".4;0;.4" dur="3s" repeatCount="indefinite"/></circle><path d="M-8 -8H8V8H-8ZM-3 -13V-8M3 -13V-8M-3 8V13M3 8V13M-13 -3H-8M-13 3H-8M8 -3H13M8 3H13" fill="none" stroke="#A5F3FC" stroke-width="1.5"/></g>
  <text x="75" y="139" text-anchor="middle" fill="#F8FAFC" font-size="15" font-weight="700">BUILD</text><text x="75" y="157" text-anchor="middle" fill="#94A3B8" font-size="10">Apps · APIs · Data</text>
  <g transform="translate(450 91)"><circle r="24" fill="#0B1720" stroke="#2DD4BF" stroke-width="1.5"/><circle r="31" fill="none" stroke="#2DD4BF" stroke-opacity=".28"><animate attributeName="r" values="28;36;28" dur="3.5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".4;0;.4" dur="3.5s" repeatCount="indefinite"/></circle><path d="M-11 10L-4 2L1 5L10 -8" fill="none" stroke="#99F6E4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="-8" r="3" fill="#99F6E4"/></g>
  <text x="450" y="139" text-anchor="middle" fill="#F8FAFC" font-size="15" font-weight="700">ANALYSE</text><text x="450" y="157" text-anchor="middle" fill="#94A3B8" font-size="10">Insights · Research</text>
  <g transform="translate(825 91)"><circle r="24" fill="#0B1720" stroke="#BEF264" stroke-width="1.5"/><circle r="31" fill="none" stroke="#BEF264" stroke-opacity=".28"><animate attributeName="r" values="28;36;28" dur="4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".4;0;.4" dur="4s" repeatCount="indefinite"/></circle><path d="M-10 9L-2 1L3 5L12 -8M4 -8H12V0" fill="none" stroke="#D9F99D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="825" y="139" text-anchor="middle" fill="#F8FAFC" font-size="15" font-weight="700">IMPROVE</text><text x="825" y="157" text-anchor="middle" fill="#94A3B8" font-size="10">Strategy · Delivery</text>
</g>
<g fill="#0B1720" stroke="url(#line)" stroke-width="1.2"><circle cx="250" cy="91" r="5"/><circle cx="635" cy="91" r="5"/><circle cx="1015" cy="91" r="5"/></g>
<circle r="5" fill="#F8FAFC" filter="url(#glow)"><animateMotion dur="7s" repeatCount="indefinite" path="M75 91H1125"/><animate attributeName="opacity" values="1;.35;1" dur="1s" repeatCount="indefinite"/></circle>
<g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle">
<rect x="166" y="52" width="170" height="22" rx="11" fill="#FFFFFF" fill-opacity=".045" stroke="#67E8F9" stroke-opacity=".25"/><text x="251" y="66" fill="#A5F3FC">LIFEHUB · RAILWAYS</text>
<rect x="550" y="52" width="170" height="22" rx="11" fill="#FFFFFF" fill-opacity=".045" stroke="#2DD4BF" stroke-opacity=".25"/><text x="635" y="66" fill="#99F6E4">INTERVIEW · NOTES</text>
<rect x="930" y="52" width="170" height="22" rx="11" fill="#FFFFFF" fill-opacity=".045" stroke="#BEF264" stroke-opacity=".25"/><text x="1015" y="66" fill="#D9F99D">TECH × BUSINESS</text>
</g>
</svg>