<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Aman Jain — Developer Activity Loop</title>
  <desc id="desc">A self-hosted animated developer workflow showing code, build, analyse, and ship with moving signal pulses.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080B12"/><stop offset="1" stop-color="#10252B"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67E8F9"/><stop offset=".52" stop-color="#2DD4BF"/><stop offset="1" stop-color="#BEF264"/></linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#94A3B8" stroke-opacity=".07"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="220" rx="20" fill="url(#bg)"/><rect width="1200" height="220" rx="20" fill="url(#grid)"/>
  <text x="42" y="36" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="3">THE DEVELOPER LOOP</text>
  <path d="M115 104H1085" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <path d="M115 104H1085" stroke="url(#signal)" stroke-width="2" stroke-dasharray="8 14"><animate attributeName="stroke-dashoffset" values="0;-110" dur="4s" repeatCount="indefinite"/></path>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(145 104)"><circle r="27" fill="#0B1720" stroke="#67E8F9" stroke-width="1.5"/><path d="M-9 -7L-16 0L-9 7M9 -7L16 0L9 7M3 -12L-3 12" fill="none" stroke="#A5F3FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="145" y="153" fill="#F8FAFC" font-size="15" font-weight="700">CODE</text><text x="145" y="173" fill="#94A3B8" font-size="11">Design &amp; develop</text>
    <g transform="translate(448 104)"><circle r="27" fill="#0B1720" stroke="#2DD4BF" stroke-width="1.5"/><path d="M-12 3L-4 11L13 -10" fill="none" stroke="#99F6E4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="448" y="153" fill="#F8FAFC" font-size="15" font-weight="700">BUILD</text><text x="448" y="173" fill="#94A3B8" font-size="11">Test &amp; integrate</text>
    <g transform="translate(752 104)"><circle r="27" fill="#0B1720" stroke="#2DD4BF" stroke-width="1.5"/><path d="M-13 10L-4 1L2 5L13 -9M5 -9H13V-1" fill="none" stroke="#99F6E4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="752" y="153" fill="#F8FAFC" font-size="15" font-weight="700">ANALYSE</text><text x="752" y="173" fill="#94A3B8" font-size="11">Learn from data</text>
    <g transform="translate(1055 104)"><circle r="27" fill="#0B1720" stroke="#BEF264" stroke-width="1.5"/><path d="M-12 0H10M3 -8L11 0L3 8" fill="none" stroke="#D9F99D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="1055" y="153" fill="#F8FAFC" font-size="15" font-weight="700">SHIP</text><text x="1055" y="173" fill="#94A3B8" font-size="11">Improve &amp; iterate</text>
  </g>
  <circle r="5" fill="#F8FAFC" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" path="M145 104H1055"/><animate attributeName="opacity" values="1;.3;1" dur="1.1s" repeatCount="indefinite"/></circle>
  <text x="600" y="204" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" text-anchor="middle" letter-spacing="1.6">SMALL ITERATIONS · PRACTICAL SOLUTIONS · CONTINUOUS LEARNING</text>
</svg>