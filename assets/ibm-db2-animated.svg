<svg xmlns="http://www.w3.org/2000/svg" width="128" height="64" viewBox="0 0 128 64" role="img" aria-labelledby="title">
<title id="title">Animated IBM Db2 logo</title>
<rect width="128" height="64" rx="8" fill="#FFFFFF"/>
<g fill="#1F70C1">
<text x="8" y="28" font-family="Arial,sans-serif" font-size="25" font-weight="800" letter-spacing="1">IBM</text>
<path d="M8 11h47 M8 16h47 M8 21h47 M8 26h47 M8 31h47" stroke="#1F70C1" stroke-width="1" opacity=".9"/>
<text x="9" y="51" font-family="Arial,sans-serif" font-size="20" font-weight="700">Db2</text>
</g>
<path d="M65 49H119" stroke="#1F70C1" stroke-width="3" stroke-linecap="round">
<animate attributeName="stroke-dasharray" values="0 54;54 0;0 54" dur="2.4s" repeatCount="indefinite"/>
</path>
<circle cx="119" cy="49" r="3" fill="#1F70C1"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
</svg>