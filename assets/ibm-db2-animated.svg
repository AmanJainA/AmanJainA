<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="title">
  <title id="title">Animated IBM Db2 database icon</title>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78C8FF"/>
      <stop offset="1" stop-color="#1261A0"/>
    </linearGradient>
  </defs>
  <circle cx="48" cy="48" r="39" fill="#0D1B2A" stroke="#2F81F7" stroke-width="2" opacity=".95"/>
  <circle cx="48" cy="48" r="32" fill="none" stroke="#78C8FF" stroke-width="1.5" opacity=".45">
    <animate attributeName="r" values="27;35;27" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".6;.08;.6" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <g>
    <path d="M25 34 C25 27 71 27 71 34 L71 62 C71 69 25 69 25 62 Z" fill="url(#blue)" stroke="#D6F0FF" stroke-width="1.6"/>
    <ellipse cx="48" cy="34" rx="23" ry="7" fill="#D6F0FF" stroke="#1261A0" stroke-width="1.6"/>
    <path d="M25 44 C25 51 71 51 71 44 M25 53 C25 60 71 60 71 53" fill="none" stroke="#D6F0FF" stroke-width="1.5" opacity=".9"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
  </g>
  <text x="48" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#D6F0FF">IBM Db2</text>
</svg>