<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="title">
  <title id="title">Animated Microsoft SQL Server database icon</title>
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A80"/>
      <stop offset="1" stop-color="#B71C1C"/>
    </linearGradient>
  </defs>
  <circle cx="48" cy="48" r="39" fill="#241216" stroke="#F85149" stroke-width="2"/>
  <circle cx="48" cy="48" r="32" fill="none" stroke="#FF8A80" stroke-width="1.5" opacity=".45">
    <animate attributeName="r" values="27;35;27" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".6;.08;.6" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <g>
    <path d="M29 33 C29 26 67 26 67 33 L67 61 C67 68 29 68 29 61 Z" fill="url(#red)" stroke="#FFE3E3" stroke-width="1.5"/>
    <ellipse cx="48" cy="33" rx="19" ry="7" fill="#FFE3E3" stroke="#B71C1C" stroke-width="1.5"/>
    <path d="M29 43 C29 50 67 50 67 43 M29 52 C29 59 67 59 67 52" fill="none" stroke="#FFE3E3" stroke-width="1.5" opacity=".95"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.2s" repeatCount="indefinite"/>
  </g>
  <text x="48" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#FFE3E3">SQL Server</text>
</svg>