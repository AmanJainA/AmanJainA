<rect width="128" height="64" rx="8" fill="#FFFFFF"/>
<g transform="translate(8 8)">
<path d="M6 7 26 0 42 7 22 15Z" fill="#F04B3A"/>
<path d="M6 7v27l16 8V15Z" fill="#B3261E"/>
<path d="M22 15 42 7v27l-20 8Z" fill="#D83B32"/>
<path d="M6 20 22 28 42 20" fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".9"/>
<path d="M6 29 22 37 42 29" fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".9"/>
<path d="M4 7 24 0 44 7" fill="none" stroke="#FF9A8E" stroke-width="1.5">
<animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/>
